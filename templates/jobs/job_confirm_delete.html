{% extends "base.html" %}
{% block title %}Delete job | HireSense AI{% endblock %}
{% block content %}
<main class="container py-5"><div class="col-md-7 mx-auto card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3">Delete “{{ object.title }}”?</h1><p class="text-muted">This action cannot be undone.</p><form method="post">{% csrf_token %}<a class="btn btn-outline-secondary" href="{% url 'jobs:detail' object.pk %}">Cancel</a><button class="btn btn-danger" type="submit">Delete job</button></form></div></div></main>
{% endblock %}
