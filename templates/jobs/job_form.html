{% extends "base.html" %}
{% block title %}Job | HireSense AI{% endblock %}
{% block content %}
<main class="container py-5"><div class="col-lg-8 mx-auto"><a href="{% url 'jobs:list' %}" class="text-decoration-none">&larr; Jobs</a><h1 class="mt-3">{% if object %}Edit job{% else %}Post a job{% endif %}</h1><form method="post" class="card border-0 shadow-sm mt-4"><div class="card-body p-4">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary" type="submit">Save job</button></div></form></div></main>
{% endblock %}
