{% extends "base.html" %}
{% block title %}Profile | HireSense AI{% endblock %}
{% block content %}
<main class="container py-5"><div class="mb-4"><a href="{% url 'accounts:dashboard' %}" class="text-decoration-none">&larr; Dashboard</a><h1 class="mt-2">Your profile</h1></div>{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}<form method="post" class="card border-0 shadow-sm"><div class="card-body p-4">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button type="submit" class="btn btn-primary">Save changes</button></div></form></main>
{% endblock %}
