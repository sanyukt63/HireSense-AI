{% extends "base.html" %}
{% block title %}Sign in | HireSense AI{% endblock %}
{% block content %}
<main class="auth-page"><section class="auth-card"><p class="eyebrow">HireSense AI</p><h1>Welcome back</h1><p class="text-muted">Sign in to continue to your workspace.</p><form method="post" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary w-100" type="submit">Sign in</button></form><p class="mt-3 mb-0">New here? <a href="{% url 'accounts:register' %}">Create an account</a>.</p></section></main>
{% endblock %}
